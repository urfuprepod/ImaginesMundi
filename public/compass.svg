<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <title>Золотая роза ветров</title>
  <defs>
    <linearGradient id="gold" x1="70" y1="40" x2="320" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0C994"/><stop offset=".5" stop-color="#A78038"/><stop offset="1" stop-color="#D6BD83"/>
    </linearGradient>
    <g id="ray">
