    <circle cx="200" cy="200" r="132" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="126" stroke-width=".6"/>
    <circle cx="200" cy="200" r="88" stroke-width="2"/>
    <circle cx="200" cy="200" r="83" stroke-width=".6"/>
